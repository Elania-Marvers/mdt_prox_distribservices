# =============================================================================
#  dnsmasq en mode « TFTP SEUL »  (PRODUCTION)
#
#  Installé par scripts/setup-vm.sh dans  /etc/dnsmasq.d/mdtprox-tftp.conf
#  (le service est le « dnsmasq.service » standard de Debian).
#
#  Rôle : envoyer aux PC, par TFTP, les deux petits programmes de démarrage
#         ipxe.efi (PC UEFI) et undionly.kpxe (PC BIOS) placés dans /srv/tftp.
#         Ensuite iPXE prend le relais en HTTP (voir boot/boot.ipxe).
#
#  CE FICHIER NE FAIT PAS DE DHCP : c'est le serveur DHCP de l'établissement qui distribue les adresses IP et
#  qui dit aux PC « va chercher ipxe.efi sur 10.0.0.3 » (options 66/67,
#  voir scripts/dhcp-pxe.ps1). Aucune ligne « dhcp-range » ici : on ne
#  doit JAMAIS en ajouter, sinon cette VM se mettrait à répondre aux PC en
#  concurrence avec le DHCP de l'établissement.
# =============================================================================

# Pas de serveur DNS (dnsmasq écouterait sinon sur le port 53).
port=0

# Serveur TFTP, limité au dossier ci-dessous (les chemins avec « .. » sont refusés).
enable-tftp
tftp-root=/srv/tftp

# Facultatif : n'écouter que sur une carte réseau (nom à relever avec « ip -br a »).
# Par défaut dnsmasq sert toutes les cartes de la VM (il n'y en a qu'une).
#interface=ens18
#bind-interfaces

# Voir les transferts : « journalctl -u dnsmasq -f » (une ligne « sent … to … » par fichier).
# Tester depuis la VM :  curl -s -o /dev/null -w '%{http_code}\n' tftp://127.0.0.1/undionly.kpxe
