# =============================================================================
#  dnsmasq : DHCP + TFTP pour le BANC D'ESSAI ISOLÉ (une VM, un PC de test)
#
#  !!!  RÉSEAU D'ESSAI SEULEMENT.  Ce fichier fait aussi du DHCP : il ne doit JAMAIS tourner sur une carte
#  !!!  réseau reliée au réseau de production (il répondrait aux postes à la place du DHCP de l'établissement).
#
#  Montage : la VM a deux cartes. La carte « gestion » (réseau de production) n'offre AUCUN service aux postes ;
#  la carte « essai » est reliée à un commutateur ou à un VLAN dédié, où ne se trouve que le PC d'essai.
#
#  Mode d'emploi (dans la VM, avec /srv/tftp rempli par scripts/setup-vm.sh) :
#    1. remplacer les deux valeurs « A_RELEVER_… » ci-dessous ;
#    2. systemctl stop dnsmasq          (le TFTP de production et ce fichier se disputeraient le port 69)
#    3. dnsmasq --test --conf-file=/chemin/dnsmasq-lab.conf
#    4. dnsmasq --keep-in-foreground --conf-file=/chemin/dnsmasq-lab.conf
#    5. démarrer le PC d'essai par le réseau et lire les lignes DHCP affichées par « log-dhcp ».
#
#  Chaîne de démarrage : DHCP -> TFTP (ipxe.efi ou undionly.kpxe) -> iPXE refait un DHCP, se reconnaît (option 175)
#  et reçoit l'adresse http://<VM>:8080/boot.ipxe -> mini-système.
#  À VÉRIFIER SUR BANC : tout ce fichier (jamais exécuté).
# =============================================================================
port=0
log-dhcp

# Carte réseau du réseau d'ESSAI uniquement (nom à relever avec « ip -br a »). Obligatoire : c'est la garantie d'isolement.
interface=A_RELEVER_NOM_DE_LA_CARTE_ESSAI
bind-interfaces

# Exemple : réseau d'essai 10.200.0.0/24, VM en .1, PC d'essai pris dans la plage ci-dessous (à adapter, jamais le réseau de production).
dhcp-range=10.200.0.100,10.200.0.150,255.255.255.0,2h
# Pas de passerelle ni de DNS : le réseau d'essai est fermé.
dhcp-option=option:router
dhcp-option=option:dns-server

enable-tftp
tftp-root=/srv/tftp

# --- Reconnaître le type de PC et un iPXE déjà chargé
dhcp-match=set:ipxe,175
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

# --- 1re étape : PC en démarrage réseau « d'origine » -> on lui envoie iPXE selon son type
dhcp-boot=tag:!ipxe,tag:bios,undionly.kpxe
dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi

# --- 2e étape : iPXE est chargé et redemande -> on lui donne le script servi par l'API
# Remplacer A_RELEVER_IP_DE_LA_VM par l'adresse de la VM sur le réseau d'essai (10.200.0.1 dans l'exemple ci-dessus).
dhcp-boot=tag:ipxe,http://A_RELEVER_IP_DE_LA_VM:8080/boot.ipxe
