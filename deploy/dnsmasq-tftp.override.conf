# =============================================================================
#  Complément (« drop-in » systemd) pour le service dnsmasq standard de Debian,
#  utilisé ici comme serveur TFTP SEUL (configuration : boot/dnsmasq-tftp.conf).
#
#  Installé par scripts/setup-vm.sh dans :
#      /etc/systemd/system/dnsmasq.service.d/mdtprox-tftp.conf
#
#  Il ne change rien d'autre que : « redémarrer le TFTP tout seul s'il s'arrête »
#  et « ne démarrer qu'une fois le réseau prêt ».
#  Le service d'origine reste celui de Debian (« systemctl status dnsmasq »).
# =============================================================================

[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Restart=on-failure
RestartSec=5
